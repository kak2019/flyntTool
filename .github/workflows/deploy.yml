name: Deploy Flynt Tools

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/flynt-tools
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart flynt-tools || pm2 start npm --name flynt-tools -- start
