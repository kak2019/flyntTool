name: Deploy Flynt Tools

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env*.local' \
            -czf /tmp/flynt-tools.tar.gz .
          mv /tmp/flynt-tools.tar.gz .

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: flynt-tools.tar.gz
          target: /tmp/flynt-deploy
          overwrite: true

      - name: Install and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/flynt-tools
            rm -rf .next
            rm -f src/instrumentation.ts
            tar -xzf /tmp/flynt-deploy/flynt-tools.tar.gz
            rm -rf /tmp/flynt-deploy
            npm install --omit=dev
            pm2 delete flynt-tools || true
            sleep 1
            echo "listeners on 3001 before kill:"
            ss -lptn "sport = :3001" || true
            if command -v fuser >/dev/null 2>&1; then
              fuser -k -9 3001/tcp || true
            fi
            PIDS=$(ss -lptn "sport = :3001" | grep -oE "pid=[0-9]+" | cut -d= -f2 | sort -u || true)
            if [ -n "$PIDS" ]; then
              echo "killing $PIDS"
              kill -9 $PIDS || true
            fi
            sleep 2
            echo "listeners on 3001 after kill:"
            ss -lptn "sport = :3001" || true
            pm2 start ./node_modules/next/dist/bin/next --name flynt-tools -- start --port 3001 --hostname 127.0.0.1
            pm2 save || true
            ready=0
            for i in $(seq 1 45); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 http://127.0.0.1:3001/login || echo 000)
              echo "health $i status=$code"
              if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              echo "app did not become ready on :3001"
              ss -lptn "sport = :3001" || true
              pm2 status || true
              pm2 logs flynt-tools --lines 160 --nostream || true
              exit 1
            fi
            echo "app is up"
