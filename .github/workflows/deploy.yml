name: Deploy Flynt Tools

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env*.local' \
            -czf /tmp/flynt-tools.tar.gz .
          mv /tmp/flynt-tools.tar.gz .

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: flynt-tools.tar.gz
          target: /tmp/flynt-deploy
          overwrite: true

      - name: Install and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/flynt-tools
            rm -rf .next
            rm -f src/instrumentation.ts
            tar -xzf /tmp/flynt-deploy/flynt-tools.tar.gz
            rm -rf /tmp/flynt-deploy
            npm install --omit=dev
            pm2 restart flynt-tools || pm2 start npm --name flynt-tools -- start
