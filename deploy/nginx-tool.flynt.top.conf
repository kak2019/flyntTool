# 使用前：把下面的证书路径改成 certbot 生成的实际文件，
# 或先用 HTTP 80 跑通后再 certbot --nginx -d tool.flynt.top

server {
    listen 80;
    server_name tool.flynt.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tool.flynt.top;

    # ssl_certificate     /etc/letsencrypt/live/tool.flynt.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tool.flynt.top/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
